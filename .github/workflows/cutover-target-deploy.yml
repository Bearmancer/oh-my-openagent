name: Cutover target deploy (Sisyphus Labs, workers.dev only)

# Stage 1 of the account move (plan: sisyphuslabs/common-infra docs/cutover-workers.md). Deploys
# oh-my-openagent-web and omo-get to the Sisyphus Labs account from their *.dest configs, with no
# hostnames and no cron, so the target can be verified before omo.dev moves. Run by hand only. The
# live deploys (web-deploy.yml, get-worker-deploy.yml) and their configs are unchanged. No D1
# migrations run here: the target database gets its schema and rows from the cutover copy tool.
on:
  workflow_dispatch:
    inputs:
      worker:
        description: Which Worker
        required: true
        type: choice
        options: [web, get]

permissions:
  contents: read

concurrency:
  group: cutover-target-deploy-${{ inputs.worker }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'code-yeongyu/oh-my-openagent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cutover-target
    env:
      CLOUDFLARE_ACCOUNT_ID: 6511ce566bfe27228f536a8fb9448be5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Build oh-my-openagent-web (no token in this step)
        if: inputs.worker == 'web'
        working-directory: packages/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run prebuild
          bunx opennextjs-cloudflare build --config wrangler.dest.toml

      - name: Deploy oh-my-openagent-web
        if: inputs.worker == 'web'
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEST_API_TOKEN }}
        run: bunx opennextjs-cloudflare deploy --config wrangler.dest.toml -- --no-x-provision

      - name: Smoke oh-my-openagent-web
        if: inputs.worker == 'web'
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://oh-my-openagent-web.sisyphus-labs.workers.dev/)
          echo "workers.dev answered $code"
          case "$code" in 200|307|308) ;; *) exit 1 ;; esac

      - name: Install omo-get (no token in this step)
        if: inputs.worker == 'get'
        working-directory: packages/get-worker
        run: bun install --frozen-lockfile

      - name: Deploy omo-get
        if: inputs.worker == 'get'
        working-directory: packages/get-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEST_API_TOKEN }}
        run: bunx wrangler deploy --config wrangler.dest.jsonc --no-x-provision

      - name: Smoke omo-get
        if: inputs.worker == 'get'
        run: |
          set -euo pipefail
          base=https://omo-get.sisyphus-labs.workers.dev
          curl -fsS "$base/healthz"
          # /channels/latest falls back to npm with a 200 if R2 fails; only an r2 source proves the binding.
          curl -fsS -D - -o /dev/null "$base/channels/latest" | tr -d '\r' | grep -qi '^x-omo-source: r2$'
          # D1 is read without a fallback; it answers 200 once the cutover copy has filled the target.
          curl -fsS "$base/stats/downloads" >/dev/null
